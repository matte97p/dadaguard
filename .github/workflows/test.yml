name: test

# Build + suite (`node --test`, nessun framework). Tre modi di essere invocata:
#   · `pull_request` — il segnale sulla PR, prima del merge;
#   · `workflow_call` — come primo job di `deploy.yml` e `release.yml`, che ci mettono `needs: test`;
#   · `workflow_dispatch` — di soccorso, quando l'evento non arriva (sotto).
# Niente trigger `push`: su main ci arrivano già entrambi i chiamanti, e tenerlo faceva girare la suite
# tre volte sullo stesso commit.
#
# Il dispatch serve perché il 13/08/2026 GitHub ha perso QUATTRO eventi push: nessuna run, nessuna check
# suite sul commit, Actions «operational» sullo status page. Con il check `test` obbligatorio su main, un
# evento perso non lascia la PR «non verificata» ma BLOCCATA, e chiudere/riaprire la PR non basta (provato):
# l'unico rimedio era un commit vuoto, che resta nella history per sempre. Da qui si rilancia la suite sul
# branch della PR — il check run si attacca al commit, che è ciò che il ruleset guarda — senza inquinare
# niente: `gh workflow run test.yml --ref <branch>`.
#
# Il terzo modo è quello che conta. Il buco che questo file chiude non era «non si vede se è rosso», era
# che `deploy.yml` e `release.yml` partono da un push su main IN PARALLELO e non si guardano: una suite
# rossa arrivava in ECS e sul registry pubblico comunque, e il rosso su questo workflow restava
# decorativo. Renderlo `workflow_call` + `needs` è ciò che lo rende bloccante senza dipendere dalle
# impostazioni del repo. L'altra metà — il check `test` come required status check su `main` — è accesa
# come ruleset dal 13/08/2026: da lì, ogni commit che entra in main è passato da qui.
#
# Quel ruleset ha una conseguenza che si è vista subito: un push che porta `[skip ci]` non potrà MAI
# soddisfare un check obbligatorio (nessuna run parte, quindi il check resta «expected» per sempre), e
# infatti `release.yml` ha smesso di committare su main il suo bump di versione — ora lo registra il tag.
# Se un domani qualcosa deve scrivere su main da dentro la CI, è questo il muro che troverà.
#
# `npm run build` e non solo `npm test`: lo chiede CONTRIBUTING.md, e la suite è tutta lato server —
# un errore in `web/*.jsx` passerebbe verde qui per poi fermare il `docker build` del deploy su main,
# bloccando anche i commit successivi. Costa 400ms.
#
# Niente segreti, niente OIDC, niente AWS: i test sono offline (fixture + funzioni pure). Se un giorno
# servisse una credenziale, quella NON va qui — va in un job separato, che le PR dai fork non toccano.

on:
  pull_request:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

# Una PR che riceve tre push di fila non ha bisogno di tre run: vince l'ultima. Il gruppo include la
# `sha` quando non c'è un branch di PR (cioè quando gira dentro a deploy/release): lì ogni commit ha un
# gruppo suo, quindi non si cancella niente a vicenda — e una run «cancelled» fermerebbe il deploy, che
# non è un successo. Niente espressione in `cancel-in-progress`: il gruppo fa già la distinzione.
concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # la stessa major dell'immagine (Dockerfile: node:22-slim)
          cache: npm

      # `npm ci` e non `npm install`: rispetta il lockfile e non lo riscrive.
      - run: npm ci

      - run: npm run build

      - run: npm test

      # ⚠️ La prova di FUMO: carica ogni pagina in Chrome e fallisce se la console ha un errore.
      # Serve perche' il 31/08/2026 una pagina e' arrivata in produzione bianca, con un
      # `ReferenceError` a ogni render: il bundler non lo vede (non e' un errore di sintassi) e le
      # asserzioni di `npm test` nemmeno, perche' nessuna RENDERIZZA un componente. Chrome e' gia'
      # installato sui runner, quindi non aggiunge dipendenze ne' tempo di setup.
      - run: npm run smoke

      # L'immagine si costruiva SOLO dopo il merge (deploy.yml, release.yml), quindi un guasto che vive
      # solo dentro al container passava tutti i controlli e si scopriva in produzione: è così che dal
      # 29/06/2026 al 17/08/2026 nessun deploy è andato a buon fine, con `npm test` sempre verde
      # (mancava `COPY shared ./shared`, e il server moriva all'avvio con ERR_MODULE_NOT_FOUND).
      # Costruire e AVVIARE l'immagine qui prova la cosa vera: che il server parta davvero.
      - name: Costruisci l'immagine
        run: docker build -t dadaguard-ci .

      - name: Il server parte dentro al container (import di tutti i moduli)
        run: |
          docker run --rm --entrypoint node dadaguard-ci \
            -e "import('/app/server/index.js').then(()=>{console.log('server: import ok');process.exit(0)}).catch(e=>{console.error('server: import FALLITO',e);process.exit(1)})"
