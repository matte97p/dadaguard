# Pubblica l'immagine OSS su GitHub Container Registry + Docker Hub e crea la GitHub Release.
# Tre strade, tutte idempotenti (mai una versione doppia sul registry):
#   1. Push su main col `version` di package.json bumpato → rilascia quella versione.
#   2. Push su main SENZA bump ma con file dell'IMMAGINE cambiati (server/web/deps) → auto
#      patch-bump a partire dall'ULTIMO TAG, senza committare niente su main.
#   3. Push di un tag v* → release esplicita classica (il tag deve combaciare con package.json).
#
# Il registro di «cosa è già uscito» sono i TAG `v*`, non il `version` di package.json su main. Prima
# l'auto patch-bump si scriveva il bump come commit `[skip ci]` su main: da quando main ha un ruleset che
# richiede il check `test`, quel push viene RIFIUTATO (`GH013: Required status check "test" is expected`)
# — e non può passare, perché un commit `[skip ci]` non farà mai girare nessun check. Il bump ora vive
# solo nel working tree della run: entra nell'immagine (il Dockerfile copia package.json) e viene
# registrato dal tag `v<versione>` che la Release stacca in fondo. Conseguenza da sapere: su main
# `package.json` resta indietro rispetto all'ultima versione pubblicata, ed è normale — la verità è
# `git tag -l 'v*' | sort -V | tail -1`.
# Push su main che tocca solo doc/test/CI → niente da fare. Allineato al pattern degli altri repo
# OSS (demowright/pentest-framework/…): main → pubblica, deciso confrontando col registry + il diff.
# "File spediti" = ciò che il Dockerfile mette nell'immagine (server + sorgenti frontend + package*),
# non doc/test/.github/deploy (esclusi via .dockerignore).
# Distinto da deploy.yml (che deploya l'istanza l'organizzazione interna su ECS a ogni push su main).
# Nota: l'immagine eredita la visibilità del package GHCR — rendila "public" dopo il primo push.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Quarta strada, di soccorso: il 13/08/2026 GitHub ha PERSO due eventi push su main — nessuna run,
  # nessuna check suite, Actions «operational» sullo status page. `deploy.yml` si è salvato perché aveva
  # già il dispatch; qui non c'era modo di recuperare, e un rilascio perso resta perso fino al push dopo.
  # Non cambia nulla della logica: su `refs/heads/main` il piano decide esattamente come su un push.
  workflow_dispatch: {}

permissions:
  contents: write # creare il tag e la Release (nessun push su main: vedi la testa del file)
  packages: write # pushare su ghcr.io

jobs:
  # La suite PRIMA di toccare qualcosa: senza questo `needs`, un push su main con i test rossi
  # arrivava in ECS comunque (i tre workflow partono in parallelo e non si guardano). Il check su PR
  # rende visibile il rosso; questo lo rende BLOCCANTE, che è la parte che conta.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # serve la history + i tag per diffare i file spediti col rilascio precedente

      # Decide la versione e SE pubblicare (vedi i tre modi in testa al file). Su main confronta la
      # versione locale col registry (Docker Hub, che espone i tag pubblici): avanti → rilascia; uguale
      # → auto patch-bump solo se è cambiato ciò che entra nell'immagine. `minor` (X.Y) è il tag mobile.
      - id: plan
        run: |
          set -euo pipefail
          LOCAL="$(node -p "require('./package.json').version")"
          PUBLISH=false
          V=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [[ "$V" != "$LOCAL" ]]; then
              echo "::error::tag $GITHUB_REF_NAME non combacia con package.json ($LOCAL)"; exit 1
            fi
            PUBLISH=true
          elif [[ "${{ github.repository_owner }}" != "matte97p" ]]; then
            echo "::notice::fork — publish disabilitato"
          else
            PUBLISHED="$(curl -fsSL "https://hub.docker.com/v2/repositories/matte97/dadaguard/tags?page_size=100" \
              | jq -r '.results[].name' 2>/dev/null || true)"
            # L'ultima versione USCITA la dicono i tag, non package.json su main (che resta indietro:
            # l'auto patch-bump non committa più niente — vedi la testa del file).
            LAST="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
            if [[ -z "$LAST" ]]; then
              echo "::notice::nessun tag v* — prima release: $LOCAL"
              V="$LOCAL"; PUBLISH=true
            elif ! grep -qx "$LOCAL" <<< "$PUBLISHED" && [[ "$(printf '%s\n%s\n' "$LAST" "$LOCAL" | sort -V | tail -1)" == "$LOCAL" && "$LOCAL" != "$LAST" ]]; then
              # package.json bumpato di proposito, oltre l'ultimo tag e non ancora sul registry.
              echo "::notice::$LOCAL non ancora pubblicata e oltre v$LAST — rilascio"
              V="$LOCAL"; PUBLISH=true
            else
              # Patch-bump solo se è cambiato ciò che ENTRA nell'immagine (server + sorgenti frontend +
              # dipendenze) rispetto all'ultimo tag. Doc/test/CI/deploy non spediscono → niente.
              # `shared` è nella lista perché il server lo importa e il Dockerfile lo copia: senza,
              # un cambio che tocca solo quella cartella non pubblicherebbe niente e l'immagine OSS
              # resterebbe indietro rispetto al codice che spedisce davvero.
              SHIP='server shared web index.html vite.config.js package.json package-lock.json'
              if git diff --quiet "v$LAST" HEAD -- $SHIP; then
                echo "::notice::nessun file spedito cambiato da v$LAST — skip"
              else
                V="$(node -p "const [a,b,c]='$LAST'.split('.').map(Number); \`\${a}.\${b}.\${c + 1}\`")"
                # Il bump vive SOLO nel working tree della run: entra nell'immagine (il Dockerfile copia
                # package.json) e resta registrato dal tag v$V che la Release stacca in fondo. Nessun
                # commit e nessun push su main, che è protetto da un ruleset e li rifiuterebbe.
                npm version "$V" --no-git-tag-version --allow-same-version >/dev/null
                echo "::notice::file spediti cambiati da v$LAST — patch-bump a $V (senza commit su main)"
                PUBLISH=true
              fi
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == true ]]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.plan.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub IN PARALLELO a GHCR — solo per il CONTATORE pull pubblico (GHCR non lo espone).
      # Richiede il secret repo DOCKERHUB_TOKEN (access token read/write da hub.docker.com).
      - if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: matte97
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.plan.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          # stessi tag pushati su entrambi i registry in un'unica build. La versione arriva da `plan`
          # (su un push a main non c'è un tag ref da cui dedurla, come faceva type=semver).
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/matte97/dadaguard
          tags: |
            type=raw,value=${{ steps.plan.outputs.version }}
            type=raw,value=${{ steps.plan.outputs.minor }}
            type=raw,value=latest

      - if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Crea (se manca) il tag git vX.Y.Z e la GitHub Release. Su un push a main è questo passo a
      # staccare il tag — così un `chore(release):` mergiato pubblica senza `git tag` a mano.
      - if: steps.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plan.outputs.version }}
          generate_release_notes: true
