name: deploy

# Build → push su ECR → nuova revision della task definition → update del servizio ECS.
# Niente chiavi: autenticazione via OIDC (il ruolo è in aws-management, layer management/oidc-github).
# Da qui in poi il deploy di Dadaguard parte da QUESTO repo: nessun `terragrunt apply` manuale.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # necessario per l'OIDC
  contents: read

# Un solo deploy per volta: una nuova push su main cancella quello ancora in corso,
# così vince SEMPRE l'ultimo commit (niente run parallele che si sovrascrivono a vicenda
# ri-deployando codice vecchio).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Config dell'ambiente di deploy via GitHub repo *variables* (Settings → Variables):
# AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, AWS_DEPLOY_ROLE_ARN — così il repo pubblico non
# hardcoda nulla di specifico. Chi fa fork e vuole un proprio deploy imposta le sue.
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR: ${{ vars.ECR_REPOSITORY }}
  CLUSTER: ${{ vars.ECS_CLUSTER }}
  SERVICE: dadaguard
  CONTAINER: dadaguard
  ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  # La suite PRIMA di toccare qualcosa: senza questo `needs`, un push su main con i test rossi
  # arrivava in ECS comunque (i tre workflow partono in parallelo e non si guardano). Il check su PR
  # rende visibile il rosso; questo lo rende BLOCCANTE, che è la parte che conta.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build --platform linux/amd64 -t "$ECR:$TAG" .
          docker push "$ECR:$TAG"
          echo "IMAGE=$ECR:$TAG" >> "$GITHUB_ENV"

      - name: Deploy to ECS (nuova revision con la nuova immagine)
        run: |
          # Riusa la task definition gestita da Terraform: ne crea una revision col solo
          # campo `image` aggiornato, poi punta il servizio alla nuova revision.
          aws ecs describe-task-definition --task-definition "$SERVICE" --query taskDefinition > td.json
          jq --arg IMG "$IMAGE" --arg C "$CONTAINER" '
            .containerDefinitions |= map(if .name == $C then .image = $IMG else . end)
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
               requiresCompatibilities, cpu, memory}
          ' td.json > new-td.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
                --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$ARN" >/dev/null
          echo "Deployato $IMAGE → $ARN"

      # `update-service` ritorna appena ECS ACCETTA la richiesta, non quando i task nuovi servono
      # traffico: senza questa attesa il workflow diventava verde mentre l'app rispondeva ancora col
      # codice precedente (visto: due minuti di bundle vecchio dopo un merge "riuscito"). Qui la spia
      # verde significa "il servizio è stabile sulla nuova revision"; se non ci arriva, il deploy
      # FALLISCE — e un rollout che non converge è esattamente ciò che si vuole sapere subito.
      # Il waiter dell'SDK riprova ogni 15s per un massimo di 10 minuti.
      - name: Attendi che il servizio sia stabile (rollout completato)
        run: |
          if aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "Rollout completato: il servizio è stabile sulla nuova revision."
          else
            echo "::error::Il servizio non è tornato stabile entro il timeout: rollout non convergente."
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason}}' \
              --output json
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[:5].message' --output json
            exit 1
          fi
