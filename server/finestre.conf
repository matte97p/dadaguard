# finestre.conf — quanto indietro guarda ogni chiamata, e quanto puo' scaricare al massimo.
#
# Perche' esiste. Le pagine erano lente e nessuno sapeva dire di quanto: la finestra e il tetto di
# ogni endpoint erano numeri scritti a mano in SEDICI punti diversi (`ore = 24` in accessi.js,
# `ore = 168` in mappaAccessi.js, `days = 30` in budgets.js, `MAX_EVENTI = 5000` in teleport.js), e
# nessuna chiamata dalla UI ne passava uno: decideva il server, e il dev vedeva solo l'attesa.
# Un numero sparso in sedici file non e' una decisione, e' sedici decisioni che non si parlano.
#
# La regola: di default si guardano DATI RECENTI e POCHI, e la finestra la allarga chi guarda.
# Aspettare trenta secondi per vedere una settimana di eventi quando la domanda era «cosa succede
# adesso» e' il difetto che questo file esiste per togliere.
#
# ⚠️ Il TETTO non e' la finestra. La finestra dice DA QUANDO, il tetto dice QUANTE righe al massimo
# si scaricano prima di fermarsi: senza, una giornata storta diventa una pagina che non carica, e con
# un tetto ma senza dirlo diventa una pagina che mente. Chi tronca lo DICE nella risposta
# (`troncato: true`), e la pagina lo mostra: un dato parziale letto come completo e' peggio di un
# dato che manca.
#
# Formato: cinque campi separati da `|`, gli spazi attorno non contano. Righe vuote e `#` sono note.
#
#   chiave | unita | default | massimo | tetto righe
#
# unita: `ore` o `giorni`. `-` come tetto = la chiamata non scarica righe, e' un'istantanea.

# La pagina Accessi: si apre durante un guasto, quindi parte da UN'ORA e non da un giorno.
# Il tetto e' 10000, il massimo che CloudWatch Insights accetta per una StartQuery.
# ⚠️ Le righe che arrivano qui sono EVENTI, non conteggi: `eventiInsights` chiede `@message` intero e
# somma in JavaScript (il commento di prima diceva il contrario, e diceva 1500 come se fosse
# abbondante). Con 1500 il giro del watchdog, che guarda 24 ORE, leggeva un CAMPIONE quasi ogni
# giorno: il 18/09/2026 su 776 DDL in produzione in dieci minuti il canale ne ha annunciate 591.
# ⚠️ Sopra i 10000 non si sale: il tetto e' dell'API. Oltre quel numero la lettura resta parziale, e
# la sola cosa onesta e' DIRLO, che e' quello che fa `troncato` (vedi `segnali` in accessi.js).
teleport            | ore    | 1    | 168  | 10000
# Chi ha cosa: qui la domanda non e' «cosa succede adesso» ma «chi ha accesso», e una persona che non
# entra da tre giorni deve comparire lo stesso. Resta larga apposta, ma non piu' di una settimana.
accessi-mappa       | ore    | 168  | 720  | 2000
# I rilasci: la finestra utile e' la giornata di lavoro, non il mese.
deploys             | ore    | 24   | 720  | 300
# Le corse dei cron: come sopra, e il tetto e' quello che gia' c'era.
runs                | ore    | 24   | 720  | 300
# I budget sono mensili per natura: la finestra e' il mese e non si stringe.
budgets             | giorni | 30   | 90   | -
# Istantanee: rispondono su cosa c'e' ADESSO, non su una finestra. Restano qui per essere elencate,
# perche' un endpoint che non compare in questo file e' un endpoint di cui nessuno ha deciso niente.
quotas              | ore    | 0    | 0    | -
security            | ore    | 0    | 0    | -
waste               | ore    | 0    | 0    | -
freetier            | ore    | 0    | 0    | -
topology            | ore    | 0    | 0    | -
